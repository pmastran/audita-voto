name: Sincronizar catálogo oficial do TSE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar TSE e salvar somente metadados oficiais
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ vars.AUDITA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUDITA_SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.sync_catalog
