name: Publicar Audita Voto (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1' # weekly TSE catalog refresh (UTC)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tentar auditoria oficial AC primeiro turno
        env:
          PYTHONPATH: .
          AUDITA_STATIC_PUBLISH: '1'
          AUDITA_MAX_ZIP_MB: '60'
        run: |
          python -m scripts.run_audit --uf AC --turno 1 --modo completo --comparecimento-minimo 100 --minimo-secoes 2 --mesmo-municipio true || echo "Auditoria indisponivel ou nao validada; nenhum resultado sera inventado"
      - name: Montar site sem credenciais secretas
        env:
          AUDITA_SUPABASE_URL: ${{ vars.AUDITA_SUPABASE_URL }}
          AUDITA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUDITA_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
