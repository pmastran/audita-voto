name: Publicar Audita Voto (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montar site sem credenciais secretas
        env:
          AUDITA_SUPABASE_URL: ${{ vars.AUDITA_SUPABASE_URL }}
          AUDITA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUDITA_SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
